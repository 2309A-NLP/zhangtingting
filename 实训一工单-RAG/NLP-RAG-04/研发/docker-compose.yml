services:
  etcd:
    container_name: nlp-rag-etcd
    image: quay.io/coreos/etcd:v3.5.16
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: >
      etcd
      -advertise-client-urls=http://127.0.0.1:2379
      -listen-client-urls=http://0.0.0.0:2379
      --data-dir /etcd
    volumes:
      # Reuse the same Milvus metadata store across parse stages so all collections remain visible together.
      - D:/Desktop/NLP-RAG-04/volumes/etcd:/etcd

  minio:
    container_name: nlp-rag-minio
    image: minio/minio:RELEASE.2025-02-07T23-21-09Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: minio server /minio_data --console-address ":9001"
    volumes:
      # Reuse the same object storage across parse stages so historical collections are preserved.
      - D:/Desktop/NLP-RAG-04/volumes/minio:/minio_data
    ports:
      - "9100:9000"
      - "9101:9001"

  milvus:
    container_name: nlp-rag-milvus
    image: milvusdb/milvus:v2.4.15
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    depends_on:
      - etcd
      - minio
    volumes:
      # Reuse the same Milvus data directory across parse stages; only COLLECTION_NAME should change.
      - D:/Desktop/NLP-RAG-04/volumes/milvus:/var/lib/milvus
    ports:
      - "19531:19530"
      - "9092:9091"

  attu:
    container_name: nlp-rag-attu
    image: zilliz/attu:v2.4
    restart: unless-stopped
    depends_on:
      - milvus
    environment:
      MILVUS_URL: milvus:19530
    ports:
      - "3011:3000"

  vllm:
    container_name: nlp-rag-vllm
    image: vllm/vllm-openai:latest
    restart: unless-stopped
    command:
      - /model/llm/Qwen2.5-0.5B-Instruct
      - --served-model-name
      - Qwen2.5-0.5B-Instruct
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --dtype
      - auto
      - --max-model-len
      - "4096"
      - --gpu-memory-utilization
      - "0.80"
      - --trust-remote-code
    volumes:
      - ./model:/model
    ports:
      - "8002:8000"
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
