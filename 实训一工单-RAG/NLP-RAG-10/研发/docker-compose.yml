# 工单编号：人工智能 NLP-RAG-金融问答系统部署
# Docker Compose 编排文件 - 金融问答系统完整部署

services:
  # ============================================
  # 基础设施服务层
  # ============================================
  
  etcd:
    container_name: nlp-rag-etcd
    image: quay.io/coreos/etcd:v3.5.16
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: >
      etcd
      -advertise-client-urls=http://127.0.0.1:2379
      -listen-client-urls=http://0.0.0.0:2379
      --data-dir /etcd
    volumes:
      - ./volumes/etcd:/etcd
    networks:
      - nlp-rag-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2379/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  minio:
    container_name: nlp-rag-minio
    image: minio/minio:RELEASE.2025-02-07T23-21-09Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: minio server /minio_data --console-address ":9001"
    volumes:
      - ./volumes/minio:/minio_data
    ports:
      - "9100:9000"
      - "9101:9001"
    networks:
      - nlp-rag-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  mongodb:
    container_name: nlp-rag-mongodb
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - ./volumes/mongodb:/data/db
    ports:
      - "27017:27017"
    networks:
      - nlp-rag-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5

  mongo-express:
    container_name: nlp-rag-mongo-express
    image: mongo-express:1.0.2
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongodb:27017
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin123
      ME_CONFIG_MONGODB_ENABLE_ADMIN: "true"
    ports:
      - "8082:8081"
    networks:
      - nlp-rag-network

  milvus:
    container_name: nlp-rag-milvus
    image: milvusdb/milvus:v2.4.15
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./volumes/milvus:/var/lib/milvus
    ports:
      - "19531:19530"
      - "9092:9091"
    networks:
      - nlp-rag-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 5

  attu:
    container_name: nlp-rag-attu
    image: zilliz/attu:v2.4
    restart: unless-stopped
    depends_on:
      milvus:
        condition: service_healthy
    environment:
      MILVUS_URL: milvus:19530
    ports:
      - "3011:3000"
    networks:
      - nlp-rag-network

  # ============================================
  # AI 模型服务层
  # ============================================
  
  vllm:
    container_name: nlp-rag-vllm
    image: vllm/vllm-openai:latest
    restart: unless-stopped
    command:
      - /model/llm/Qwen2.5-0.5B-Instruct
      - --served-model-name
      - Qwen2.5-0.5B-Instruct
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --dtype
      - auto
      - --max-model-len
      - "4096"
      - --gpu-memory-utilization
      - "0.80"
      - --trust-remote-code
    volumes:
      - ./model:/model
    ports:
      - "8002:8000"
    ipc: host
    networks:
      - nlp-rag-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  # ============================================
  # 应用服务层
  # ============================================
  
  # FastAPI 后端服务
  backend:
    container_name: nlp-rag-backend
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      milvus:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      # 核心配置
      MILVUS_URI: http://milvus:19530
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DB_NAME: nlp_rag
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_SECURE: "0"
      
      # LLM 配置
      LLM_PROVIDER: openai_compatible
      LLM_API_URL: ""
      LLM_API_KEY: ""
      LLM_MODEL_NAME: ""
      LLM_FALLBACK_API_URL: http://vllm:8000/v1/chat/completions
      LLM_FALLBACK_API_KEY: ""
      LLM_FALLBACK_MODEL_NAME: Qwen2.5-0.5B-Instruct
      
      # 向量模型配置
      EMBEDDING_MODEL_PATH: /model/embedding
      LLM_LOCAL_MODEL_PATH: /model/llm
      
      # 应用配置
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      LOG_LEVEL: info
    volumes:
      - ./data:/app/data
      - ./model:/model
      - ./artifacts:/app/artifacts
      - ./reports:/app/reports
      - ./config:/app/config
    ports:
      - "8000:8000"
    networks:
      - nlp-rag-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Gradio 前端服务
  frontend:
    container_name: nlp-rag-frontend
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      API_BASE: http://backend:8000/api
      GRADIO_SERVER_NAME: "0.0.0.0"
      GRADIO_SERVER_PORT: "7860"
    volumes:
      - ./frontend:/app/frontend
    ports:
      - "7860:7860"
    networks:
      - nlp-rag-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

# ============================================
# 网络配置
# ============================================
networks:
  nlp-rag-network:
    driver: bridge
    name: nlp-rag-network

# ============================================
# 卷配置
# ============================================
volumes:
  etcd_data:
    driver: local
  minio_data:
    driver: local
  mongodb_data:
    driver: local
  milvus_data:
    driver: local
