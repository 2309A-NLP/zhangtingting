services:
  caddy:
    image: caddy:2.8-alpine
    container_name: rag-caddy
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend/dist:/srv/frontend/dist:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - rag-net

volumes:
  caddy_data:
  caddy_config:
